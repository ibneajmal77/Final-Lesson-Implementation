# ============================================================================
# FILE: alembic.ini
#
# THINK OF THIS FILE AS: the settings for the database migration tool.
#
# Alembic is what applies schema changes — creating tables, adding columns — in
# the right order, exactly once each, on every copy of the database. This file
# tells it where to find the migration scripts and how noisy to be.
#
# NOTE WHAT IS NOT HERE: the database address.
#   A standard alembic.ini contains a `sqlalchemy.url = ...` line. It is
#   deliberately absent, and that absence is the most important thing about this
#   file. Instead, migrations/env.py reads the address from the application's own
#   settings, which read it from the DATABASE_URL environment variable.
#
#   Two reasons that is better:
#     1. NO CREDENTIALS IN THE REPOSITORY. A committed connection string is a
#        committed password.
#     2. ONE SOURCE OF TRUTH. The migrations always run against exactly the
#        database the application uses. With the address written here as well,
#        the two could disagree — and you would migrate one database while the
#        app talked to another, which produces the baffling situation of an app
#        reporting a missing column you just watched being created.
#
# HOW IT IS USED: automatically, by any `alembic` command run from the project
# root — `alembic upgrade head` to apply migrations, `alembic check` to verify
# they match models.py.
#
# The format is INI: [section] headings with key = value lines under them.
# ============================================================================

[alembic]
# Where the migration scripts live: env.py and the numbered files in versions/.
# Relative to the project root, so alembic commands must be run from there.
script_location = packages/db/supportops_db/migrations

# Adds "." (the project root) to Python's import path before loading env.py.
# Needed because env.py imports from this project's packages, which are not
# installed in the usual way — this is a monorepo with several packages in
# folders. env.py then extends the path further for the individual packages.
prepend_sys_path = .


# ===========================================================================
# LOGGING CONFIGURATION
#
# Everything below is Python's standard logging setup, in its own INI format.
# It controls what you SEE when running a migration, and it is worth
# understanding only because of the sqlalchemy setting.
#
# The three-part structure: a LOGGER decides what to record, a HANDLER decides
# where it goes, and a FORMATTER decides how it looks.
# ===========================================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

# The catch-all logger. WARN means only warnings and errors — so unrelated
# libraries stay quiet during a migration.
[logger_root]
level = WARN
handlers = console
qualname =

# THE SETTING WORTH KNOWING ABOUT.
#
# WARN keeps SQLAlchemy quiet. Turn this to INFO and it prints EVERY SQL
# statement it executes — which is the single most useful thing you can do when
# a migration behaves unexpectedly, because you see exactly what was sent to the
# database rather than guessing from the Python.
#
# It is off by default because a migration on a large table would otherwise
# produce thousands of lines and bury the messages that matter.
[logger_sqlalchemy]
level = WARN
# `handlers =` is empty on purpose: messages travel up to the root logger, which
# has the console handler. Listing one here as well would print everything twice.
handlers =
qualname = sqlalchemy.engine

# Alembic's OWN messages at INFO — more verbose than everything else, and rightly
# so. These are the lines telling you which migration is being applied, which is
# exactly what you want to watch during a deployment.
[logger_alembic]
level = INFO
handlers =
qualname = alembic

# Where the output goes: standard error.
#
# stderr rather than stdout so that migration progress messages stay separate
# from any actual output — which matters when a command's result is being piped
# somewhere, as in the offline SQL-generation mode described in env.py.
[handler_console]
class = StreamHandler
args = (sys.stderr,)
# No filtering here; the loggers above already decided.
level = NOTSET
formatter = generic

# What each line looks like, e.g. "INFO  [alembic.runtime.migration] Running
# upgrade 0006 -> 0007". The `-5.5s` pads the level name to exactly five
# characters, so the messages line up in a column and are easy to scan.
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
