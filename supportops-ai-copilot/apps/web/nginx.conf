# ============================================================================
# FILE: apps/web/nginx.conf
#
# THINK OF THIS FILE AS: the instructions for the web server that hands the
# console's files to a browser.
#
# It replaces nginx's built-in default site (see Dockerfile.web), and it does
# three things: serve the files, answer a health check, and make sure any address
# falls back to the main page.
#
# WHAT IT DOES NOT DO, which is worth knowing:
#   It does NOT forward API requests. The browser calls the API directly on port
#   8765 rather than through this server. That is why CORS_ORIGINS has to be set
#   on the API in docker-compose.yml — without it the browser would block those
#   calls.
#
#   Proxying /api through here instead would be the more usual production
#   arrangement: everything would come from one address, and CORS would stop
#   being a concern at all. Keeping them separate makes the two services more
#   visibly distinct, which suits a teaching project.
# ============================================================================

# A "server block" defines one website this nginx serves.
server {
    listen 80;              # port 80 INSIDE the container. docker-compose.yml maps
                            # it to 3000 on your machine

    # `_` is a catch-all name, meaning "respond to any hostname". Right here,
    # since the container is reached by IP or by service name rather than by a
    # real domain.
    server_name _;

    # Where the files live inside the container. Matches the COPY destination in
    # Dockerfile.web — change one and you must change the other.
    root /usr/share/nginx/html;

    # The file to serve when the address is a directory, so "/" serves
    # index.html.
    index index.html;

    # A health check endpoint, answered by nginx itself.
    #
    # Note it touches no files at all — it just returns the text "ok" directly.
    # That is exactly right for a liveness check: it proves the web server is
    # running and answering, without depending on anything that could fail for
    # unrelated reasons.
    #
    # docker-compose.yml calls this to decide whether the web container is
    # healthy.
    location /healthz {
        add_header Content-Type text/plain;    # so browsers show it rather than download it
        return 200 'ok';
    }

    # THE CATCH-ALL RULE, and the only non-obvious line in the file.
    #
    # `try_files` reads as a list of things to try in order:
    #   $uri        - a file at exactly that path?
    #   $uri/       - a directory at that path?
    #   /index.html - otherwise, fall back to the main page
    #
    # That last fallback is the important part. It means a request for
    # /some/unknown/path returns the console rather than a 404. This is the
    # standard configuration for a single-page application, where the JavaScript
    # rather than the server decides what a URL means — so a user refreshing the
    # page on a deep link still gets the app.
    #
    # This console does not currently use client-side routing, so the fallback is
    # not strictly needed yet. It is here so that adding routing later does not
    # require also remembering to change the web server.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
