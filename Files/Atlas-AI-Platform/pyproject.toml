[build-system]
# Python packaging metadata. This is closest to the SDK/build part of a `.csproj`.
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Runtime package metadata plus install dependencies.
name = "atlas-ai-platform"
version = "0.1.0"
description = "Atlas AI Platform Phase 00 through Phase 02 implementation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  # `psycopg[binary]` covers both the sync and the async driver. SQLAlchemy 2.0
  # accepts the same `postgresql+psycopg://` URL for `create_engine` and
  # `create_async_engine`, so the async slice needs no extra database driver.
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  # Promoted from dev: `httpx.AsyncClient` is the provider transport on the
  # async gateway path, so it is a runtime dependency now, not a test-only one.
  "httpx>=0.27",
  "pyyaml>=6.0",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
]

[project.optional-dependencies]
# Extra dependencies for local development, tests, linting, and type checking.
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-pyyaml>=6.0",
]
# Optional span export. Kept out of the base install so local development and CI
# never need a collector running.
otlp = [
  "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[tool.setuptools.packages.find]
# Tell setuptools to package both executable hosts (`apps`) and shared libraries
# (`packages`) from the repository root.
where = ["."]
include = ["apps*", "packages*"]

[tool.setuptools.package-data]
# Seed prompts are data files, so they are not picked up by the Python module
# scan and have to be declared for an installed (non-editable) build.
"packages.prompts" = ["seeds/*.yaml"]

[tool.pytest.ini_options]
# Pytest configuration. `pythonpath = ["."]` lets tests import `apps` and
# `packages` without installing the project globally.
testpaths = ["tests"]
pythonpath = ["."]
# `--strict-markers` turns a typo in a @pytest.mark name into an error instead
# of a silently ignored marker.
addopts = "--strict-markers"
markers = [
  "requires_database: test needs a reachable PostgreSQL instance",
]
# pytest-asyncio runs `async def` tests. Strict mode requires an explicit
# @pytest.mark.asyncio, so a plain async test can never be silently skipped.
asyncio_mode = "strict"

[tool.coverage.run]
# Coverage is measured over shipped code only. Migrations are excluded because
# they are verified by the tests in tests/migrations, not by line execution.
source = ["apps", "packages"]
omit = ["packages/db/migrations/*"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
# Measured at 65% with NO database available, so this floor holds on any
# machine. CI runs PostgreSQL, which executes ~29 more tests; raise the CI
# threshold in .github/workflows/ci.yml once the first green run reports a real
# number for that configuration.
fail_under = 62
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]

[tool.ruff]
# Ruff is the Python linter/formatter family used here.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# ASYNC is flake8-async. It is the rule family that catches a blocking call
# inside an `async def`, which is the one sync/async mistake that takes the
# whole event loop down rather than just slowing one request.
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
# Mypy is the static type checker. `strict = true` is similar in spirit to
# enabling nullable/reference and strict compiler checks in C#.
python_version = "3.11"
strict = true
packages = ["apps", "packages"]
exclude = ["packages/db/migrations"]

[[tool.mypy.overrides]]
# The OTLP exporter lives in the optional `otlp` extra, so it is legitimately
# absent in a default install. The import is already guarded by try/except at
# the call site; this stops mypy failing on the module it cannot find.
module = ["opentelemetry.exporter.*"]
ignore_missing_imports = true
