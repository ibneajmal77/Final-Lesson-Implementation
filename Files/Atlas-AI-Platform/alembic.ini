[alembic]
# Alembic is SQLAlchemy's migration tool, comparable to EF Core migrations.
script_location = packages/db/migrations
prepend_sys_path = .
# This URL is overwritten at runtime by `packages/db/migrations/env.py` using
# `packages.core.config.Settings`, so `.env` and migrations stay aligned.
sqlalchemy.url = postgresql+psycopg://atlas:atlas@localhost:55432/atlas?connect_timeout=3

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
